<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Weights</title>
<meta name="description" content="Open-weight model distribution that no company, court order, or government can switch off in one place.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #faf9f5;
    --fg: #141413;
    --muted: #5e5d59;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --fg: #f2f0e8;
      --muted: #a6a39a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { margin: 1.25rem 0 0.5rem; font-size: 2rem; letter-spacing: -0.01em; }
  p { margin: 0 0 1rem; }
  .status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="mark-light.svg">
    <img src="mark.svg" alt="Common Weights logo">
  </picture>
  <h1>Common Weights</h1>
  <p>Open-weight model distribution that no company, court order, or government can switch off in one place.</p>
  <p class="status">Coming soon.</p>
</main>
</body>
</html>
